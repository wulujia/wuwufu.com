{{- $desc := partial "seo_description.html" . -}}
{{- $images := partial "templates/_funcs/get-page-images" . -}}
{{- with index $images 0 }}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ .Permalink }}">
{{- else }}
<meta name="twitter:card" content="summary">
{{- end }}
<meta name="twitter:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title | default site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ $desc }}">
{{- with site.Params.social.twitter }}
<meta name="twitter:site" content="{{ if strings.HasPrefix . "@" }}{{ . }}{{ else }}@{{ . }}{{ end }}">
{{- end }}
